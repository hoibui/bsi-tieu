backend:
  name: github
  repo: hoibui/bsi-tieu
  branch: main
  # URL of the OAuth proxy (Cloudflare Worker). See docs/article-posting.md.
  base_url: https://sveltia-cms-auth.athoibuiqt.workers.dev
  commit_messages:
    create: 'Đăng bài: {{slug}}'
    update: 'Sửa bài: {{slug}}'
    delete: 'Xóa bài: {{slug}}'
    uploadMedia: 'Tải ảnh: {{path}}'
    deleteMedia: 'Xóa ảnh: {{path}}'

locale: vi
site_url: https://phantrungtieu.com
display_url: https://phantrungtieu.com

media_folder: upload/news
public_folder: upload/news

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: posts
    label: Bài viết (Kiến thức)
    label_singular: Bài viết
    folder: content/posts
    extension: md
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{title}} - {{date}}'
    sortable_fields: ['date', 'title']
    fields:
      - {label: Tiêu đề, name: title, widget: string}
      - label: Ngày đăng
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        date_format: 'DD/MM/YYYY'
        time_format: 'HH:mm'
        picker_utc: false
      - {label: Ảnh đại diện, name: thumbnail, widget: image, required: false}
      - {label: Mô tả ngắn, name: description, widget: text, required: false, hint: 'Hiển thị ở danh sách bài viết và Google. Để trống sẽ tự lấy từ nội dung.'}
      - {label: Ẩn bài (nháp), name: draft, widget: boolean, default: false, required: false}
      - {label: Nội dung, name: body, widget: markdown}

  - name: stories
    label: Câu chuyện
    label_singular: Câu chuyện
    folder: content/stories
    extension: md
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{title}} - {{date}}'
    sortable_fields: ['date', 'title']
    fields:
      - {label: Tiêu đề, name: title, widget: string}
      - label: Ngày đăng
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        date_format: 'DD/MM/YYYY'
        time_format: 'HH:mm'
        picker_utc: false
      - {label: Ảnh đại diện, name: thumbnail, widget: image, required: false}
      - {label: Mô tả ngắn, name: description, widget: text, required: false, hint: 'Hiển thị ở danh sách bài viết và Google. Để trống sẽ tự lấy từ nội dung.'}
      - {label: Ẩn bài (nháp), name: draft, widget: boolean, default: false, required: false}
      - {label: Nội dung, name: body, widget: markdown}

  - name: pages
    label: Trang
    files:
      - label: Bảng giá dịch vụ
        name: gia-dich-vu
        file: content/pages/gia-dich-vu.md
        fields:
          - {label: Tiêu đề trang, name: title, widget: string, default: 'Bảng Giá Dịch Vụ'}
          - {label: Tiêu đề cột 1, name: service_header, widget: string, default: 'Dịch vụ'}
          - {label: Tiêu đề cột 2, name: price_header, widget: string, default: 'Giá (VNĐ)'}
          - label: Danh sách dịch vụ
            name: rows
            widget: list
            summary: '{{fields.service}} - {{fields.price}}'
            fields:
              - {label: Dịch vụ, name: service, widget: string}
              - {label: Giá, name: price, widget: string, hint: 'Ví dụ: 150,000'}
      - label: Lịch khám
        name: lich-kham
        file: content/pages/lich-kham.md
        fields:
          - {label: Tiêu đề trang, name: title, widget: string, default: 'Lịch khám'}
          - label: Giờ làm việc
            name: hours
            widget: list
            summary: '{{fields.day}}: {{fields.time}}'
            fields:
              - {label: Ngày, name: day, widget: string, hint: 'Ví dụ: Thứ 2 - Thứ 6'}
              - {label: Giờ, name: time, widget: string, hint: 'Ví dụ: 17:00 - 20:00 hoặc Nghỉ'}
          - {label: Ghi chú ngắn, name: note, widget: string, required: false}
          - {label: Lịch khám chi tiết (cập nhật hàng tháng), name: body, widget: markdown, required: false}
      - label: Khám thai kỳ
        name: kham-thai-ki
        file: content/pages/kham-thai-ki.md
        fields:
          - {label: Tiêu đề trang, name: title, widget: string, default: 'Khám thai kỳ'}
          - {label: Nội dung, name: body, widget: markdown}
